[package]
name = "opendnp3"
description = "Runtime-agnostic, no_std-compatible DNP3 (IEEE 1815) protocol library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["tracing/std", "futures-util?/std"]
async = ["dep:futures-util", "dep:spin"]

[dependencies]
tracing = { version = "0.1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
spin = { version = "0.10", default-features = false, features = ["spin_mutex"], optional = true }
