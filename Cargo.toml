[workspace]
resolver = "3"
members = [
    "opendnp3",
    "opendnp3-tokio",
    "opendnp3-smol",
    "opendnp3-std",
    "opendnp3-embassy",
    "opendnp3-compio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dnp3/opendnp3-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
