[workspace]
resolver = "3"
members = [
    "opendnp3",
    "opendnp3-tokio",
    "opendnp3-smol",
    "opendnp3-std",
    "opendnp3-embassy",
    "opendnp3-compio",
    "opendnp3-ffi",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/levyks/opendnp3-rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
