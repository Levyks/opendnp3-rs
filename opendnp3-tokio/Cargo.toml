[package]
name = "opendnp3-tokio"
description = "Tokio transport integration (TCP, TLS, serial) for the opendnp3 crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = []
tls = ["dep:tokio-rustls"]
serial = ["dep:tokio-serial"]

[dependencies]
opendnp3 = { version = "0.1.2", path = "../opendnp3", features = ["async"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-serial = { version = "5", optional = true }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
