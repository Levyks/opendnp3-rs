[package]
name = "opendnp3"
description = "DNP3 (IEEE 1815) bindings generated from opendnp3-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/levyks/opendnp3-rs"

[targets.python]
enabled = true
module_name = "opendnp3"

[targets.csharp]
enabled = true
namespace = "Levyks.OpenDnp3"
module_class = "OpenDnp3Module"
package_id = "Levyks.OpenDnp3"
target_framework = "netstandard2.0"

[targets.csharp.nuget]
title = "Levyks.OpenDnp3"
authors = ["levyks"]
project_url = "https://levyks.com"
repository_type = "git"
license_expression = "MIT OR Apache-2.0"
tags = ["dnp3", "opendnp3", "scada"]

[targets.java]
package = "com.levyks.opendnp3"

[targets.java.jvm]
enabled = true
