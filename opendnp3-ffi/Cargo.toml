[package]
name = "opendnp3-ffi"
description = "BoltFFI multi-language bindings (Python, C#, Java, Swift, Kotlin, TS) for opendnp3 (Tokio-free)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait = "0.1"
boltffi = { git = "https://github.com/Levyks/boltffi.git", branch = "feat/csharp-net-framework" }
opendnp3 = { path = "../opendnp3", features = ["async"] }

[dev-dependencies]
futures-util = "0.3"
