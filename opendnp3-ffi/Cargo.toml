[package]
name = "opendnp3-ffi"
description = "BoltFFI multi-language bindings (Python, C#, Java, Swift, Kotlin, TS) for opendnp3 (Tokio-free)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["smol-tcp"]
smol-tcp = ["dep:async-executor", "dep:async-io", "dep:async-net", "dep:futures-lite"]

[dependencies]
async-executor = { version = "1", optional = true }
async-io = { version = "2", optional = true }
async-net = { version = "2", optional = true }
async-trait = "0.1"
boltffi = { git = "https://github.com/Levyks/boltffi.git", branch = "feat/csharp-net-framework" }
futures-lite = { version = "2", optional = true }
opendnp3 = { path = "../opendnp3", features = ["async"] }

[dev-dependencies]
futures-util = "0.3"
